<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repairer Profile | AutoMart IM</title>
<link rel="icon" href="assets/automart-logo.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --navy:#002060; --navy-dark:#00133d; --ink:#1a1a2e; --muted:#6b7280;
    --bg:#eef1fa; --card:#ffffff; --border:#dfe3f0; --good:#1f9d55; --warn:#c2410c; --star:#e0a638;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .brand-bar{background:var(--navy);padding:10px 20px;text-align:center;}
  .brand-bar img{height:48px;}
  .wrap{max-width:640px;margin:-26px auto 40px;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 10px 28px rgba(0,32,96,.1);}
  .media{position:relative;height:200px;background:linear-gradient(120deg,var(--navy),var(--navy-dark));}
  .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s;}
  .media .avatar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:2.6rem;letter-spacing:.03em;}
  .status-ribbon{position:absolute;top:12px;right:12px;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700;}
  .status-ribbon.mobile{background:#eef2ff;color:#3730a3;}
  .status-ribbon.available{background:#e8f8ee;color:#1f9d55;}
  .status-ribbon.unavailable{background:#f3f4f6;color:#6b7280;}
  .body{padding:22px 24px 26px;}
  h1{margin:0 0 4px;font-size:1.35rem;}
  .rating-row{font-size:.95rem;margin-bottom:10px;}
  .stars{color:var(--star);letter-spacing:2px;font-size:1.1rem;}
  .rating-num{font-weight:700;margin-left:4px;}
  .rating-count{color:var(--muted);font-size:.85rem;}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .badge{font-size:.75rem;font-weight:700;padding:4px 11px;border-radius:20px;}
  .badge.mobile{background:#eef2ff;color:#3730a3;}
  .badge.available{background:#e8f8ee;color:#1f9d55;}
  .badge.unavailable{background:#f3f4f6;color:#6b7280;}
  .badge.price{background:#fff7e6;color:#92400e;}
  .section{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
  .section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;}
  .addr{font-size:.95rem;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .chip{background:#eef1fa;color:var(--navy);font-size:.8rem;padding:5px 11px;border-radius:20px;}
  .chip.mobile-chip{background:#eef2ff;color:#3730a3;}
  #miniMap{height:180px;border-radius:10px;margin-top:8px;border:1px solid var(--border);}
  .dist-line{font-size:.85rem;color:#3730a3;margin-top:8px;}
  .actions-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  button, a.btn{cursor:pointer;border:none;border-radius:8px;font-weight:600;font-family:inherit;font-size:.88rem;padding:11px 16px;text-decoration:none;display:inline-block;text-align:center;}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-outline{background:#eef1fa;color:var(--navy);}
  .price-line{font-size:1.05rem;font-weight:700;color:#92400e;margin-bottom:4px;}
  .price-hint{font-size:.8rem;color:var(--muted);}
  .pay-form input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;margin-top:8px;background:#fbfaff;}
  .pay-form label{display:block;font-size:.78rem;font-weight:600;margin-top:10px;}
  .btn-pay{width:100%;margin-top:14px;background:#0a2158;color:#fff;font-size:1rem;padding:13px;}
  .btn-pay:disabled{background:#9aa7c4;cursor:not-allowed;}
  .status-box{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.88rem;display:none;}
  .status-box.ok{background:#e8f8ee;color:var(--good);display:block;}
  .status-box.err{background:#fdeceb;color:#b91c1c;display:block;}
  .loading, .empty{text-align:center;color:var(--muted);padding:40px 20px;}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:10px 20px 26px;}

  /* ---------- Ratings breakdown & reviews ---------- */
  .rating-summary{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .rating-big-wrap{text-align:center;}
  .rating-big{font-size:2.6rem;font-weight:800;line-height:1;color:var(--ink);}
  .rating-big-stars{margin-top:2px;}
  .rating-big-count{font-size:.75rem;color:var(--muted);margin-top:2px;}
  .rating-bars{flex:1;min-width:170px;}
  .rating-bar-row{display:flex;align-items:center;gap:8px;font-size:.76rem;margin-bottom:5px;}
  .rating-bar-row .star-label{width:14px;color:var(--muted);text-align:right;}
  .rating-bar-track{flex:1;height:8px;background:#eee1c4;border-radius:6px;overflow:hidden;}
  .rating-bar-fill{height:100%;background:var(--star);border-radius:6px;}
  .rating-bar-row .count{width:22px;text-align:right;color:var(--muted);}
  .rate-form{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
  .star-select{display:flex;gap:4px;font-size:1.9rem;cursor:pointer;color:#d1d5db;line-height:1;user-select:none;}
  .star-select .star.active{color:var(--star);}
  .rate-form textarea, .rate-form input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;margin-top:8px;background:#fbfaff;}
  .rate-form textarea{resize:vertical;min-height:64px;}
  .btn-rate{margin-top:10px;background:var(--navy);color:#fff;padding:10px 16px;font-size:.88rem;}
  .review-list{margin-top:14px;}
  .review-card{padding:14px 0;border-top:1px solid var(--border);}
  .review-card:first-child{border-top:none;padding-top:4px;}
  .review-card .rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .review-card .rstars{color:var(--star);letter-spacing:1px;font-size:.9rem;}
  .review-card .rname{font-weight:700;font-size:.88rem;}
  .review-card .rtext{margin-top:6px;font-size:.9rem;line-height:1.45;}
  .review-card .rmeta{margin-top:8px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:12px;}
  .helpful-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.75rem;color:var(--muted);cursor:pointer;font-family:inherit;}
  .helpful-btn:hover{background:#f7f8fc;}
  .show-more-btn{background:none;border:none;color:var(--navy);font-weight:600;font-size:.85rem;cursor:pointer;padding:8px 0;font-family:inherit;}
  .no-reviews{color:var(--muted);font-size:.88rem;padding:6px 0;}
</style>
</head>
<body>

<div class="brand-bar"><img src="assets/automart-logo.png" alt="AutoMart IM" /></div>

<div class="wrap">
  <div id="loading" class="card" style="padding:0;"><div class="loading">Loading repairer profile…</div></div>
  <div id="profileCard" style="display:none;"></div>
</div>

<footer>AutoMart IM Roadside Repairer Network &middot; Powered by Google Sheets</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
/* =========================================================================
   Resilient map tile loader — inlined on every page (not a separate file)
   so no page ever breaks if tiles.js gets left behind during hosting/copying.
   ========================================================================= */
const TILE_PROVIDERS = [
  {
    name: 'Esri World Street Map',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    options: {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom',
      maxZoom: 19
    }
  },
  {
    name: 'OpenStreetMap',
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    options: { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19, subdomains: 'abc' }
  },
  {
    name: 'Wikimedia Maps',
    url: 'https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png',
    options: { attribution: '&copy; OpenStreetMap contributors, style by Wikimedia', maxZoom: 19 }
  }
];

const TILE_ERROR_THRESHOLD = 6;

function attachResilientTileLayer(map, startIndex) {
  startIndex = startIndex || 0;
  const idx = Math.min(startIndex, TILE_PROVIDERS.length - 1);
  const provider = TILE_PROVIDERS[idx];
  const layer = L.tileLayer(provider.url, provider.options);
  let errorCount = 0;

  layer.on('tileerror', () => {
    errorCount++;
    if (errorCount >= TILE_ERROR_THRESHOLD && idx < TILE_PROVIDERS.length - 1) {
      console.warn(`[AutoMart IM] Map tiles from "${provider.name}" are failing — switching to "${TILE_PROVIDERS[idx + 1].name}".`);
      map.removeLayer(layer);
      attachResilientTileLayer(map, idx + 1);
    }
  });

  layer.addTo(map);
  return layer;
}
</script>
<script>
/* =========================================================================
   CONFIG — paste your deployed Apps Script Web App URL, and your Paystack
   PUBLIC key (starts with pk_) here. The secret key never goes in the
   browser — it lives only in the Apps Script project's Script Properties.
   ========================================================================= */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbw_kjy77ZB0rGnjDB-3DJ8kjwf7t8SQqIFXJsiP1WuXDTpKmXiSbn7H7RYv_Mk83vPJ/exec",
  PAYSTACK_PUBLIC_KEY: "PASTE_YOUR_PAYSTACK_PUBLIC_KEY_HERE"
};

const AVG_SPEED_KMH = 35; // free ETA estimate: straight-line distance ÷ an assumed average road speed

const params = new URLSearchParams(location.search);
const repairerId = params.get('id');
let repairer = null;
let userLatLng = null;
let miniMap = null;

async function loadProfile() {
  if (!repairerId) {
    showError('No repairer specified. Use the link from the map or your invitation.');
    return;
  }
  if (CONFIG.API_URL.includes('PASTE_YOUR')) {
    showError('The API_URL has not been configured yet — see the README for setup steps.');
    return;
  }
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=get_repairer&id=${encodeURIComponent(repairerId)}`);
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    repairer = result.repairer;
    render();
  } catch (err) {
    showError(err.message);
  }
}

function showError(msg) {
  document.getElementById('loading').innerHTML = `<div class="empty">⚠️ ${escapeHtml(msg)}</div>`;
}

function render() {
  const r = repairer;
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('profileCard');
  el.style.display = 'block';

  const color = colorForName(r.ShopName || '?');
  const initials = initialsForName(r.ShopName || '?');
  const services = (r.Services || '').split(',').map(s => s.trim()).filter(Boolean);
  const mobileServices = (r.MobileServices || '').split(',').map(s => s.trim()).filter(Boolean);
  const hasPrice = r.CalloutPrice !== '' && r.CalloutPrice !== undefined && r.CalloutPrice !== null && !isNaN(r.CalloutPrice) && Number(r.CalloutPrice) > 0;

  el.innerHTML = `
    <div class="card">
      <div class="media">
        <div class="avatar" style="background:${color}">${initials}</div>
        ${r.ImageURL ? `<img src="${escapeHtml(r.ImageURL)}" alt="" onload="this.style.opacity=1" onerror="this.remove()">` : ''}
        <span class="status-ribbon ${r.AvailableNow === false ? 'unavailable' : 'available'}">${r.AvailableNow === false ? '⚪ Not available' : '🟢 Available now'}</span>
      </div>
      <div class="body">
        <h1>${escapeHtml(r.ShopName)}</h1>
        <div class="rating-row">${starsHtml(r.Rating, r.RatingCount)}</div>
        <div class="badges">
          ${r.IsMobile ? '<span class="badge mobile">🚐 Mobile mechanic</span>' : ''}
          ${hasPrice ? `<span class="badge price">From ₦${Number(r.CalloutPrice).toLocaleString()}</span>` : ''}
        </div>

        <div class="section">
          <h2>${r.IsMobile ? 'Service area' : 'Address'}</h2>
          <div class="addr">${r.IsMobile ? '🚐 Mobile mechanic — travels to you. Based near: ' : '📍 '}${escapeHtml(r.Address)}</div>
          <div id="distLine" class="dist-line" style="display:none;"></div>
          <div id="miniMap"></div>
        </div>

        ${services.length ? `
        <div class="section">
          <h2>Services</h2>
          <div class="chips">${services.map(s => `<span class="chip">${escapeHtml(s)}</span>`).join('')}</div>
        </div>` : ''}

        ${mobileServices.length ? `
        <div class="section">
          <h2>Roadside / mobile services</h2>
          <div class="chips">${mobileServices.map(s => `<span class="chip mobile-chip">${escapeHtml(s)}</span>`).join('')}</div>
        </div>` : ''}

        <div class="section" id="reviewsSection">
          <h2>Ratings and reviews</h2>
          <div id="reviewsContent"><div class="loading">Loading reviews…</div></div>
        </div>

        <div class="section">
          <h2>Contact</h2>
          <div class="actions-row">
            <a class="btn btn-navy" href="tel:${escapeHtml(r.Phone)}">📞 Call ${escapeHtml(r.Phone)}</a>
            <a class="btn btn-outline" href="https://www.google.com/maps/dir/?api=1&destination=${r.Latitude},${r.Longitude}" target="_blank" rel="noopener">🧭 Get directions</a>
            <button class="btn-outline" id="locateBtn">📍 Distance from me</button>
          </div>
        </div>

        <div class="section" id="bookSection">
          <h2>Book &amp; pay</h2>
          ${hasPrice ? `
            <div class="price-line">₦${Number(r.CalloutPrice).toLocaleString()} callout / service price</div>
            <div class="price-hint">Pay securely via Paystack to book this repairer through AutoMart IM. Your payment is verified before the booking is confirmed.</div>
            <div class="pay-form">
              <label>Your name</label>
              <input type="text" id="payerName" placeholder="Full name">
              <label>Phone number</label>
              <input type="tel" id="payerPhone" placeholder="080…">
              <label>Email (required by Paystack)</label>
              <input type="email" id="payerEmail" placeholder="you@example.com">
              <button class="btn-pay" id="payBtn">Pay ₦${Number(r.CalloutPrice).toLocaleString()} &amp; Book</button>
              <div class="status-box" id="payStatus"></div>
            </div>
          ` : `
            <div class="price-hint">This repairer hasn't set a fixed price yet — call them directly to agree a price for your job.</div>
          `}
        </div>
      </div>
    </div>`;

  initMiniMap(r);
  document.getElementById('locateBtn').addEventListener('click', () => locateAndShowDistance(r));
  if (hasPrice) document.getElementById('payBtn').addEventListener('click', () => startPayment(r));
  loadReviews();
}

// ---------- Ratings breakdown & reviews ----------
let selectedStars = 0;
let allReviews = [];
const REVIEWS_PAGE_SIZE = 5;
let reviewsShown = REVIEWS_PAGE_SIZE;

async function loadReviews() {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=get_reviews&id=${encodeURIComponent(repairerId)}`);
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    allReviews = result.reviews;
    reviewsShown = REVIEWS_PAGE_SIZE;
    renderReviewsSection(result);
  } catch (err) {
    document.getElementById('reviewsContent').innerHTML = `<div class="no-reviews">Could not load reviews: ${escapeHtml(err.message)}</div>`;
  }
}

function renderReviewsSection(summary) {
  const { breakdown, total, average } = summary;
  const maxCount = Math.max(1, ...[5, 4, 3, 2, 1].map(n => breakdown[n] || 0));

  const barsHtml = [5, 4, 3, 2, 1].map(n => {
    const count = breakdown[n] || 0;
    const pct = Math.round((count / maxCount) * 100);
    return `
      <div class="rating-bar-row">
        <span class="star-label">${n}★</span>
        <div class="rating-bar-track"><div class="rating-bar-fill" style="width:${count ? pct : 0}%"></div></div>
        <span class="count">${count}</span>
      </div>`;
  }).join('');

  document.getElementById('reviewsContent').innerHTML = `
    <div class="rating-summary">
      <div class="rating-big-wrap">
        <div class="rating-big">${total ? average.toFixed(1) : '—'}</div>
        <div class="rating-big-stars">${starsHtml(average, null)}</div>
        <div class="rating-big-count">${total} rating${total === 1 ? '' : 's'}</div>
      </div>
      <div class="rating-bars">${barsHtml}</div>
    </div>

    <div class="rate-form">
      <label style="font-weight:600;font-size:.88rem;">How would you rate this repairer?</label>
      <div class="star-select" id="starSelect">
        ${[1, 2, 3, 4, 5].map(n => `<span class="star" data-value="${n}">★</span>`).join('')}
      </div>
      <input type="text" id="reviewerName" placeholder="Your name (optional)">
      <textarea id="reviewText" placeholder="Share details of your experience (optional)"></textarea>
      <button class="btn-rate" id="submitReviewBtn">Submit review</button>
      <div class="status-box" id="reviewStatus"></div>
    </div>

    <div class="review-list" id="reviewList"></div>
    <button class="show-more-btn" id="showMoreReviews" style="display:none;">Show more reviews</button>
  `;

  wireStarSelect();
  document.getElementById('submitReviewBtn').addEventListener('click', submitReview);
  renderReviewList();
}

function wireStarSelect() {
  const stars = document.querySelectorAll('#starSelect .star');
  stars.forEach(star => {
    star.addEventListener('click', () => {
      selectedStars = Number(star.getAttribute('data-value'));
      stars.forEach(s => s.classList.toggle('active', Number(s.getAttribute('data-value')) <= selectedStars));
    });
  });
}

function renderReviewList() {
  const listEl = document.getElementById('reviewList');
  const showBtn = document.getElementById('showMoreReviews');
  if (!allReviews.length) {
    listEl.innerHTML = '<div class="no-reviews">No reviews yet — be the first to rate this repairer.</div>';
    showBtn.style.display = 'none';
    return;
  }
  const visible = allReviews.slice(0, reviewsShown);
  listEl.innerHTML = visible.map(rv => `
    <div class="review-card" data-review-id="${rv.ID}">
      <div class="rhead">
        <span class="rstars">${'★'.repeat(rv.Stars)}${'☆'.repeat(5 - rv.Stars)}</span>
        <span class="rname">${escapeHtml(rv.CarOwnerName)}</span>
      </div>
      ${rv.ReviewText ? `<div class="rtext">${escapeHtml(rv.ReviewText)}</div>` : ''}
      <div class="rmeta">
        <span>${formatDate(rv.Timestamp)}</span>
        <button class="helpful-btn" data-review-id="${rv.ID}">👍 Helpful${rv.HelpfulCount ? ` (${rv.HelpfulCount})` : ''}</button>
      </div>
    </div>`).join('');

  listEl.querySelectorAll('.helpful-btn').forEach(btn => {
    btn.addEventListener('click', () => markHelpful(btn.getAttribute('data-review-id'), btn));
  });

  showBtn.style.display = allReviews.length > reviewsShown ? 'inline-block' : 'none';
}

document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'showMoreReviews') {
    reviewsShown += REVIEWS_PAGE_SIZE;
    renderReviewList();
  }
});

async function submitReview() {
  const btn = document.getElementById('submitReviewBtn');
  if (!selectedStars) {
    showReviewStatus('err', 'Please tap a star to choose your rating first.');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'submit_review',
        data: {
          repairerId,
          stars: selectedStars,
          carOwnerName: document.getElementById('reviewerName').value.trim(),
          reviewText: document.getElementById('reviewText').value.trim()
        }
      })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    selectedStars = 0;
    // loadReviews() rebuilds this whole section (including the status box
    // and the form) from fresh server data, so the confirmation has to be
    // shown *after* that rebuild — otherwise it's wiped out immediately.
    await loadReviews();
    showReviewStatus('ok', '✅ ' + result.message);
  } catch (err) {
    showReviewStatus('err', 'Could not submit review: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit review';
  }
}

async function markHelpful(reviewId, btn) {
  btn.disabled = true;
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'mark_helpful', data: { reviewId } })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    btn.textContent = `👍 Helpful (${result.helpfulCount})`;
  } catch (err) {
    btn.disabled = false;
  }
}

function showReviewStatus(type, msg) {
  const box = document.getElementById('reviewStatus');
  box.className = 'status-box ' + type;
  box.textContent = msg;
}

function initMiniMap(r) {
  if (isNaN(r.Latitude) || isNaN(r.Longitude)) return;
  setTimeout(() => {
    miniMap = L.map('miniMap', { zoomControl: false, scrollWheelZoom: false }).setView([r.Latitude, r.Longitude], 14);
    attachResilientTileLayer(miniMap);
    L.marker([r.Latitude, r.Longitude]).addTo(miniMap);
    miniMap.invalidateSize();
  }, 50);
}

function locateAndShowDistance(r) {
  if (!navigator.geolocation) { alert('Your browser does not support location services.'); return; }
  const btn = document.getElementById('locateBtn');
  btn.disabled = true;
  btn.textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      btn.disabled = false;
      btn.textContent = '📍 Distance from me';
      userLatLng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const dist = distanceKm(userLatLng, r);
      const mins = etaMinutes(dist);
      const line = document.getElementById('distLine');
      line.style.display = 'block';
      line.textContent = `${dist.toFixed(1)} km away · ~${mins} min drive (estimate)`;
      if (miniMap) {
        const userIcon = L.divIcon({
          html: '<div style="background:#2563eb;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #2563eb;"></div>',
          className: '', iconSize: [14, 14], iconAnchor: [7, 7]
        });
        L.marker([userLatLng.lat, userLatLng.lng], { icon: userIcon }).addTo(miniMap).bindPopup('You are here');
        miniMap.fitBounds([[r.Latitude, r.Longitude], [userLatLng.lat, userLatLng.lng]], { padding: [30, 30] });
      }
    },
    (err) => {
      btn.disabled = false;
      btn.textContent = '📍 Distance from me';
      alert('Could not get your location: ' + err.message);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function startPayment(r) {
  const name = document.getElementById('payerName').value.trim();
  const phone = document.getElementById('payerPhone').value.trim();
  const email = document.getElementById('payerEmail').value.trim();

  if (!name || !phone || !email) {
    showPayStatus('err', 'Please fill in your name, phone, and email before paying.');
    return;
  }
  if (CONFIG.PAYSTACK_PUBLIC_KEY.includes('PASTE_YOUR')) {
    showPayStatus('err', 'Payments are not configured yet — AutoMart IM needs to add a Paystack public key.');
    return;
  }
  if (typeof PaystackPop === 'undefined') {
    showPayStatus('err', 'Could not load the payment popup. Check your connection and try again.');
    return;
  }

  const payBtn = document.getElementById('payBtn');
  payBtn.disabled = true;
  payBtn.textContent = 'Opening payment…';

  const handler = PaystackPop.setup({
    key: CONFIG.PAYSTACK_PUBLIC_KEY,
    email: email,
    amount: Math.round(Number(r.CalloutPrice) * 100), // Paystack expects kobo
    currency: 'NGN',
    metadata: {
      custom_fields: [
        { display_name: 'Repairer', variable_name: 'repairer', value: r.ShopName },
        { display_name: 'Payer phone', variable_name: 'payer_phone', value: phone }
      ]
    },
    callback: function (response) {
      verifyPayment(response.reference, name, phone);
    },
    onClose: function () {
      payBtn.disabled = false;
      payBtn.textContent = `Pay ₦${Number(r.CalloutPrice).toLocaleString()} & Book`;
    }
  });
  handler.openIframe();
}

async function verifyPayment(reference, payerName, payerPhone) {
  const payBtn = document.getElementById('payBtn');
  payBtn.textContent = 'Verifying payment…';
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'verify_payment',
        data: { reference, repairerId, payerName, payerPhone }
      })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    showPayStatus('ok', '✅ ' + result.message);
    payBtn.style.display = 'none';
  } catch (err) {
    showPayStatus('err', 'Payment was made but could not be verified: ' + err.message + '. Please contact AutoMart IM with your reference: ' + reference);
    payBtn.disabled = false;
    payBtn.textContent = `Pay ₦${Number(repairer.CalloutPrice).toLocaleString()} & Book`;
  }
}

function showPayStatus(type, msg) {
  const box = document.getElementById('payStatus');
  box.className = 'status-box ' + type;
  box.textContent = msg;
}

function distanceKm(a, b) {
  const R = 6371;
  const dLat = toRad(b.Latitude - a.lat);
  const dLng = toRad(b.Longitude - a.lng);
  const lat1 = toRad(a.lat), lat2 = toRad(b.Latitude);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function toRad(deg) { return deg * Math.PI / 180; }
function etaMinutes(distKm) {
  const mins = Math.round((distKm / AVG_SPEED_KMH) * 60);
  return mins < 1 ? '<1' : mins;
}

function starsHtml(rating, count) {
  const num = Number(rating) || 0;
  const rounded = Math.max(0, Math.min(5, Math.round(num)));
  let stars = '';
  for (let i = 1; i <= 5; i++) stars += i <= rounded ? '★' : '☆';
  const label = num > 0 ? num.toFixed(1) : 'No rating yet';
  return `<span class="stars">${stars}</span><span class="rating-num">${label}</span>${count ? `<span class="rating-count"> (${count} rating${count === 1 ? '' : 's'})</span>` : ''}`;
}

function colorForName(name) {
  let hash = 0;
  const str = String(name || '?');
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 52%)`;
}

function initialsForName(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
