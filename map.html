<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find a Nearby Auto-Repairer | AutoMart IM</title>
<link rel="icon" href="assets/automart-logo.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --brand:#002060; --brand-dark:#00133d; --ink:#1a1a2e; --muted:#6b7280;
    --bg:#eef1fa; --card:#ffffff; --border:#dfe3f0; --star:#e0a638;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);}
  .app{display:flex;flex-direction:column;height:100%;}
  .brand-bar{background:var(--brand);padding:8px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
  .brand-bar img{height:44px;}
  header{background:linear-gradient(120deg,var(--brand),var(--brand-dark));color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{margin:0;font-size:1.15rem;}
  header .actions{display:flex;gap:8px;align-items:center;}
  button{cursor:pointer;border:none;border-radius:8px;font-weight:600;font-family:inherit;font-size:.85rem;}
  .btn-white{background:#fff;color:var(--brand-dark);padding:9px 14px;}
  .btn-white:disabled{opacity:.6;cursor:wait;}
  .layout{flex:1;display:flex;min-height:0;}
  #map{flex:1;min-width:0;}
  .sidebar{width:340px;max-width:40vw;background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:14px;}
  .sidebar h2{font-size:.95rem;margin:4px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .repair-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s;}
  .repair-card:hover{box-shadow:0 4px 14px rgba(26,26,46,.08);}
  .repair-card .name{font-weight:700;font-size:.95rem;}
  .repair-card .meta{font-size:.8rem;color:var(--muted);margin-top:4px;}
  .repair-card .dist{display:inline-block;margin-top:6px;background:#eef2ff;color:#3730a3;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;}
  .repair-card .tags{margin-top:6px;font-size:.75rem;color:var(--brand-dark);}
  .repair-card .rating{margin-top:5px;font-size:.8rem;}
  .repair-card .stars{color:var(--star);letter-spacing:1px;}
  .repair-card .eta{color:#3730a3;}
  .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .mini-badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;}
  .mini-badge.mobile{background:#eef2ff;color:#3730a3;}
  .mini-badge.available{background:#e8f8ee;color:#1f9d55;}
  .mini-badge.unavailable{background:#f3f4f6;color:#6b7280;}
  .mini-badge.price{background:#fff7e6;color:#92400e;}
  .repair-card a.directions, .repair-card a.view-profile{display:inline-block;margin-top:8px;margin-right:6px;font-size:.78rem;text-decoration:none;padding:6px 10px;border-radius:6px;}
  .repair-card a.directions{color:#fff;background:var(--brand);}
  .repair-card a.view-profile{color:var(--brand);background:#eef1fa;font-weight:600;}
  .empty, .loading{color:var(--muted);font-size:.85rem;padding:20px 6px;text-align:center;}
  .status-pill{font-size:.75rem;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;}
  @media (max-width: 720px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;max-width:100%;max-height:40vh;border-left:none;border-top:1px solid var(--border);}
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand-bar"><img src="assets/automart-logo.png" alt="AutoMart IM" /></div>
  <header>
    <h1>🚗 Find a Nearby Auto-Repairer</h1>
    <div class="actions">
      <span class="status-pill" id="countPill">Loading…</span>
      <button class="btn-white" id="locateBtn">📍 Use my location</button>
    </div>
  </header>
  <div class="layout">
    <div id="map"></div>
    <div class="sidebar">
      <h2 id="listTitle">All registered repairers</h2>
      <div id="list"><div class="loading">Loading repairers…</div></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =========================================================================
   Resilient map tile loader — inlined on every page (not a separate file)
   so no page ever breaks if tiles.js gets left behind during hosting/copying.
   ------------------------------------------------------------------------
   Free raster tile providers occasionally stop working for reasons outside
   our control: OpenStreetMap's own volunteer-run servers block IPs/networks
   that exceed their usage policy, and CARTO's free basemaps now require an
   account + API key. Rather than hard-code one provider and risk another
   silent breakage, this tries a short list of free, no-API-key raster
   providers in order, and automatically swaps to the next one if too many
   tiles fail to load. Call attachResilientTileLayer(map) instead of
   L.tileLayer(...).addTo(map) directly.
   ========================================================================= */
const TILE_PROVIDERS = [
  {
    name: 'Esri World Street Map',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    options: {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom',
      maxZoom: 19
    }
  },
  {
    name: 'OpenStreetMap',
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    options: { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19, subdomains: 'abc' }
  },
  {
    name: 'Wikimedia Maps',
    url: 'https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png',
    options: { attribution: '&copy; OpenStreetMap contributors, style by Wikimedia', maxZoom: 19 }
  }
];

const TILE_ERROR_THRESHOLD = 6; // tile failures before we give up on a provider

function attachResilientTileLayer(map, startIndex) {
  startIndex = startIndex || 0;
  const idx = Math.min(startIndex, TILE_PROVIDERS.length - 1);
  const provider = TILE_PROVIDERS[idx];
  const layer = L.tileLayer(provider.url, provider.options);
  let errorCount = 0;

  layer.on('tileerror', () => {
    errorCount++;
    if (errorCount >= TILE_ERROR_THRESHOLD && idx < TILE_PROVIDERS.length - 1) {
      console.warn(`[AutoMart IM] Map tiles from "${provider.name}" are failing — switching to "${TILE_PROVIDERS[idx + 1].name}".`);
      map.removeLayer(layer);
      attachResilientTileLayer(map, idx + 1);
    }
  });

  layer.addTo(map);
  return layer;
}
</script>
<script>
/* =========================================================================
   CONFIG — paste your deployed Apps Script Web App URL here (same one used
   in signup.html). This page only ever reads Approved repairers.
   ========================================================================= */
const CONFIG = {
  API_URL: "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"
};

const map = L.map('map').setView([9.0820, 8.6753], 6); // default: Nigeria-wide view
attachResilientTileLayer(map);

const repairIcon = L.divIcon({
  html: '🔧',
  className: 'repair-emoji-icon',
  iconSize: [28, 28],
  iconAnchor: [14, 14]
});
const userIcon = L.divIcon({
  html: '<div style="background:#2563eb;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #2563eb;"></div>',
  className: '',
  iconSize: [16, 16],
  iconAnchor: [8, 8]
});

let repairers = [];
let markers = {};
let userLatLng = null;
let userMarker = null;

async function loadRepairers() {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=list`);
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    repairers = result.repairers.filter(r => !isNaN(r.Latitude) && !isNaN(r.Longitude));
    document.getElementById('countPill').textContent = `${repairers.length} shop${repairers.length === 1 ? '' : 's'} on the map`;
    plotAll();
    renderList(repairers, 'All registered repairers');
  } catch (err) {
    document.getElementById('list').innerHTML = `<div class="empty">Could not load repairers: ${err.message}</div>`;
    document.getElementById('countPill').textContent = 'Error loading';
  }
}

function plotAll() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  const bounds = [];
  repairers.forEach(r => {
    const m = L.marker([r.Latitude, r.Longitude], { icon: repairIcon }).addTo(map);
    m.bindPopup(popupHtml(r));
    markers[r.ID] = m;
    bounds.push([r.Latitude, r.Longitude]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
}

function popupHtml(r) {
  const distLine = userLatLng
    ? `<div style="margin-top:4px;font-size:.75rem;color:#3730a3;">${distanceKm(userLatLng, r).toFixed(1)} km away &middot; ~${etaMinutes(distanceKm(userLatLng, r))} min drive (estimate)</div>`
    : '';
  return `<strong>${escapeHtml(r.ShopName)}</strong><br>
    ${starsHtml(r.Rating, r.RatingCount)}<br>
    ${r.IsMobile ? 'Mobile mechanic &middot; serves: ' : ''}${escapeHtml(r.Address)}<br>
    ${r.Services ? `<span style="color:#002060;font-size:.8rem;">${escapeHtml(r.Services)}</span><br>` : ''}
    ${priceLine(r)}
    📞 ${escapeHtml(r.Phone)} ${distLine}
    <br><a href="profile.html?id=${encodeURIComponent(r.ID)}" style="display:inline-block;margin-top:6px;">View profile & book →</a>
    <br><a href="${directionsUrl(r)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:2px;">Get directions →</a>`;
}

function directionsUrl(r) {
  return `https://www.google.com/maps/dir/?api=1&destination=${r.Latitude},${r.Longitude}`;
}

function distanceKm(a, b) {
  const R = 6371;
  const dLat = toRad(b.Latitude - a.lat);
  const dLng = toRad(b.Longitude - a.lng);
  const lat1 = toRad(a.lat), lat2 = toRad(b.Latitude);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function toRad(deg) { return deg * Math.PI / 180; }

// Free, no-API-key ETA estimate: straight-line distance ÷ an assumed average
// road speed. It's an approximation (not real driving-time routing), which
// is called out to the driver as "estimate".
const AVG_SPEED_KMH = 35;
function etaMinutes(distKm) {
  const mins = Math.round((distKm / AVG_SPEED_KMH) * 60);
  return mins < 1 ? '<1' : mins;
}

function starsHtml(rating, count) {
  const num = Number(rating) || 0;
  const rounded = Math.max(0, Math.min(5, Math.round(num)));
  let stars = '';
  for (let i = 1; i <= 5; i++) stars += i <= rounded ? '★' : '☆';
  const label = num > 0 ? num.toFixed(1) : 'No rating yet';
  return `<span class="stars">${stars}</span> <span style="font-weight:700;font-size:.8rem;">${label}</span>${count ? ` <span style="color:#6b7280;font-size:.75rem;">(${count})</span>` : ''}`;
}

function badgeRow(r) {
  const parts = [];
  if (r.IsMobile) parts.push('<span class="mini-badge mobile">🚐 Mobile mechanic</span>');
  parts.push(r.AvailableNow
    ? '<span class="mini-badge available">🟢 Available now</span>'
    : '<span class="mini-badge unavailable">⚪ Not available</span>');
  if (r.CalloutPrice !== '' && r.CalloutPrice !== undefined && r.CalloutPrice !== null && !isNaN(r.CalloutPrice)) {
    parts.push(`<span class="mini-badge price">From ₦${Number(r.CalloutPrice).toLocaleString()}</span>`);
  }
  return `<div class="badge-row">${parts.join('')}</div>`;
}

function priceLine(r) {
  if (r.CalloutPrice === '' || r.CalloutPrice === undefined || r.CalloutPrice === null || isNaN(r.CalloutPrice)) return '';
  return `<div style="font-size:.78rem;color:#92400e;margin:2px 0;">From ₦${Number(r.CalloutPrice).toLocaleString()} callout</div>`;
}

function renderList(items, title) {
  document.getElementById('listTitle').textContent = title;
  const listEl = document.getElementById('list');
  if (!items.length) {
    listEl.innerHTML = '<div class="empty">No repairers found yet.</div>';
    return;
  }
  listEl.innerHTML = items.map(r => {
    const distKm = userLatLng ? distanceKm(userLatLng, r) : null;
    const dist = distKm !== null
      ? `<div class="dist">${distKm.toFixed(1)} km away &middot; ~${etaMinutes(distKm)} min (est.)</div>`
      : '';
    return `
      <div class="repair-card" data-id="${r.ID}">
        <div class="name">${escapeHtml(r.ShopName)}</div>
        <div class="rating">${starsHtml(r.Rating, r.RatingCount)}</div>
        <div class="meta">${r.IsMobile ? '🚐 Mobile &middot; serves: ' : '📍 '}${escapeHtml(r.Address)}</div>
        <div class="meta">📞 ${escapeHtml(r.Phone)}</div>
        ${r.Services ? `<div class="tags">${escapeHtml(r.Services)}</div>` : ''}
        ${priceLine(r)}
        ${badgeRow(r)}
        ${dist}
        <br><a class="view-profile" href="profile.html?id=${encodeURIComponent(r.ID)}">View profile &amp; book</a><a class="directions" href="${directionsUrl(r)}" target="_blank" rel="noopener">Get directions</a>
      </div>`;
  }).join('');

  listEl.querySelectorAll('.repair-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('a')) return; // let the directions link work normally
      const id = card.getAttribute('data-id');
      const r = repairers.find(x => x.ID === id);
      if (r) {
        map.setView([r.Latitude, r.Longitude], 15);
        markers[id].openPopup();
      }
    });
  });
}

document.getElementById('locateBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('Your browser does not support location services.'); return; }
  const btn = document.getElementById('locateBtn');
  btn.disabled = true;
  btn.textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      btn.disabled = false;
      btn.textContent = '📍 Use my location';
      userLatLng = { lat: pos.coords.latitude, lng: pos.coords.longitude };

      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.marker([userLatLng.lat, userLatLng.lng], { icon: userIcon }).addTo(map);
      userMarker.bindPopup('You are here').openPopup();

      const sorted = [...repairers].sort((a, b) => distanceKm(userLatLng, a) - distanceKm(userLatLng, b));
      map.setView([userLatLng.lat, userLatLng.lng], 13);
      renderList(sorted, 'Nearest to you');
    },
    (err) => {
      btn.disabled = false;
      btn.textContent = '📍 Use my location';
      alert('Could not get your location: ' + err.message);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadRepairers();
</script>
</body>
</html>
