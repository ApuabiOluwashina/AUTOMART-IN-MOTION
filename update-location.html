<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Update My Location | AutoMart IM</title>
<link rel="icon" href="assets/automart-logo.png" />
<style>
  :root{
    --navy:#002060; --navy-dark:#00133d; --ink:#1a1a2e; --muted:#6b7280;
    --bg:#eef1fa; --card:#ffffff; --border:#dfe3f0; --good:#1f9d55; --warn:#c2410c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .brand-bar{background:var(--navy);padding:10px 20px;text-align:center;}
  .brand-bar img{height:48px;}
  .wrap{max-width:480px;margin:-26px auto 40px;padding:0 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 24px;box-shadow:0 10px 28px rgba(0,32,96,.1);}
  .card + .card{margin-top:16px;}
  h1{font-size:1.2rem;margin:0 0 4px;}
  p.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .field .v{font-size:.95rem;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f7f8fc;border-radius:10px;margin:16px 0;}
  .toggle-row .label{font-weight:600;font-size:.9rem;}
  .switch{position:relative;display:inline-block;width:46px;height:26px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#cbd2e1;border-radius:26px;transition:.2s;}
  .slider::before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--good);}
  input:checked + .slider::before{transform:translateX(20px);}
  button{cursor:pointer;border:none;border-radius:8px;font-weight:700;font-family:inherit;width:100%;}
  .btn-locate{background:var(--navy);color:#fff;padding:15px;font-size:1rem;margin-top:6px;}
  .btn-locate:disabled{background:#9aa7c4;cursor:wait;}
  .btn-secondary{background:#eef1fa;color:var(--navy);padding:11px;font-size:.88rem;}
  input[type=tel]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;background:#fbfaff;}
  .status-box{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.88rem;display:none;}
  .status-box.ok{background:#e8f8ee;color:var(--good);display:block;}
  .status-box.err{background:#fdeceb;color:#b91c1c;display:block;}
  .loading, .empty{text-align:center;color:var(--muted);padding:20px;}
  .match{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;}
  .match .name{font-weight:700;font-size:.92rem;}
  .match a{display:inline-block;margin-top:6px;font-size:.82rem;color:var(--navy);font-weight:600;}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:10px 20px 26px;}
</style>
</head>
<body>

<div class="brand-bar"><img src="assets/automart-logo.png" alt="AutoMart IM" /></div>

<div class="wrap">
  <div id="content">
    <div class="card"><div class="loading">Loading…</div></div>
  </div>
</div>

<footer>AutoMart IM Roadside Repairer Network &middot; Powered by Google Sheets</footer>

<script>
/* =========================================================================
   CONFIG — paste your deployed Apps Script Web App URL here (same one used
   in every other page).
   ========================================================================= */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbw_kjy77ZB0rGnjDB-3DJ8kjwf7t8SQqIFXJsiP1WuXDTpKmXiSbn7H7RYv_Mk83vPJ/exec"
};

const params = new URLSearchParams(location.search);
const repairerId = params.get('id');
let repairer = null;

async function init() {
  if (CONFIG.API_URL.includes('PASTE_YOUR')) {
    document.getElementById('content').innerHTML = `<div class="card"><div class="empty">⚠️ The API_URL has not been configured yet — see the README for setup steps.</div></div>`;
    return;
  }
  if (repairerId) {
    await loadSelf();
  } else {
    renderFindLinkForm();
  }
}

async function loadSelf() {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=self_lookup&id=${encodeURIComponent(repairerId)}`);
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    repairer = result.repairer;
    renderSelf();
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="card"><div class="empty">⚠️ ${escapeHtml(err.message)}</div></div>`;
  }
}

function renderSelf() {
  const r = repairer;
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h1>📍 Update Your Location</h1>
      <p class="sub">This is your personal link — bookmark it. No login needed; anyone with this exact link can update ${escapeHtml(r.ShopName)}'s live location, so keep it private to your team.</p>

      <div class="field">
        <div class="l">Shop</div>
        <div class="v">${escapeHtml(r.ShopName)} <span style="color:var(--muted);font-size:.85rem;">(${escapeHtml(r.Status)})</span></div>
      </div>
      <div class="field">
        <div class="l">Current location on file</div>
        <div class="v" id="currentCoords">${isNaN(r.Latitude) ? 'Not set' : `${Number(r.Latitude).toFixed(6)}, ${Number(r.Longitude).toFixed(6)}`}</div>
      </div>
      <div class="field">
        <div class="l">Last updated</div>
        <div class="v" id="lastUpdated">${r.LastUpdated ? formatDate(r.LastUpdated) : '—'}</div>
      </div>

      <div class="toggle-row">
        <span class="label">🟢 Available now</span>
        <label class="switch">
          <input type="checkbox" id="availableToggle" ${r.AvailableNow !== false ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      </div>

      <button class="btn-locate" id="updateBtn">📍 Update My Location Now</button>
      <div class="status-box" id="statusBox"></div>
    </div>`;

  document.getElementById('updateBtn').addEventListener('click', updateLocation);
  document.getElementById('availableToggle').addEventListener('change', updateAvailabilityOnly);
}

function updateLocation() {
  if (!navigator.geolocation) { showStatus('err', 'Your browser does not support location services.'); return; }
  const btn = document.getElementById('updateBtn');
  btn.disabled = true;
  btn.textContent = 'Getting your location…';
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const availableNow = document.getElementById('availableToggle').checked;
      try {
        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'update_location',
            data: { id: repairerId, latitude: pos.coords.latitude, longitude: pos.coords.longitude, availableNow }
          })
        });
        const result = await res.json();
        if (!result.ok) throw new Error(result.error);
        document.getElementById('currentCoords').textContent = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
        document.getElementById('lastUpdated').textContent = 'Just now';
        showStatus('ok', '✅ Location updated. Car owners searching nearby will now see your new position.');
      } catch (err) {
        showStatus('err', 'Could not save your location: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '📍 Update My Location Now';
      }
    },
    (err) => {
      btn.disabled = false;
      btn.textContent = '📍 Update My Location Now';
      showStatus('err', 'Could not get your GPS location: ' + err.message);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function updateAvailabilityOnly(e) {
  // Toggling availability alone shouldn't require a fresh GPS fix — just
  // resend the last known coordinates along with the new flag.
  if (isNaN(repairer.Latitude) || isNaN(repairer.Longitude)) return;
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'update_location',
        data: { id: repairerId, latitude: repairer.Latitude, longitude: repairer.Longitude, availableNow: e.target.checked }
      })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    showStatus('ok', e.target.checked ? '✅ Marked as available now.' : '✅ Marked as not available.');
  } catch (err) {
    showStatus('err', 'Could not update availability: ' + err.message);
  }
}

function renderFindLinkForm() {
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h1>🔎 Find Your Update Link</h1>
      <p class="sub">Lost your personal location-update link? Enter the phone number you registered with and we'll look it up.</p>
      <input type="tel" id="phoneInput" placeholder="Phone number used at sign-up">
      <button class="btn-secondary" id="findBtn" style="margin-top:10px;">Find my link</button>
      <div id="matches"></div>
      <div class="status-box" id="statusBox"></div>
    </div>`;
  document.getElementById('findBtn').addEventListener('click', findMyLink);
  document.getElementById('phoneInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') findMyLink(); });
}

async function findMyLink() {
  const phone = document.getElementById('phoneInput').value.trim();
  if (!phone) return;
  const btn = document.getElementById('findBtn');
  btn.disabled = true;
  btn.textContent = 'Searching…';
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=find_my_link&phone=${encodeURIComponent(phone)}`);
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    const matchesEl = document.getElementById('matches');
    if (!result.matches.length) {
      matchesEl.innerHTML = `<div class="empty">No repairer found with that phone number. Double-check it, or contact AutoMart IM.</div>`;
    } else {
      matchesEl.innerHTML = result.matches.map(m => `
        <div class="match">
          <div class="name">${escapeHtml(m.ShopName)}</div>
          <a href="update-location.html?id=${encodeURIComponent(m.ID)}">Open my location page →</a>
        </div>`).join('');
    }
  } catch (err) {
    showStatus('err', err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Find my link';
  }
}

function showStatus(type, msg) {
  const box = document.getElementById('statusBox');
  box.className = 'status-box ' + type;
  box.textContent = msg;
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>
</body>
</html>
