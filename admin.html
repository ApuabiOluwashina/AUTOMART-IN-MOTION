<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repairer Network Admin | AutoMart IM</title>
<link rel="icon" href="assets/automart-logo.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --brand:#0a2158; --brand-dark:#061437; --ink:#1a1a2e; --muted:#6b7280;
    --bg:#f6f5fb; --card:#ffffff; --border:#e6e4f0;
    --good:#1f9d55; --good-bg:#e8f8ee; --warn:#b91c1c; --warn-bg:#fdeceb; --pending:#92400e; --pending-bg:#fef3c7;
    --star:#f5a623;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .brand-bar{background:#fff;padding:8px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
  .brand-bar img{height:30px;}
  header{background:linear-gradient(120deg,var(--brand),var(--brand-dark));color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{margin:0;font-size:1.2rem;}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  input, select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;}
  button{cursor:pointer;border:none;border-radius:8px;font-weight:600;font-family:inherit;font-size:.85rem;padding:8px 14px;}
  .btn-white{background:#fff;color:var(--brand-dark);}
  .btn-brand{background:var(--brand);color:#fff;}
  .btn-good{background:var(--good-bg);color:var(--good);}
  .btn-warn{background:var(--warn-bg);color:var(--warn);}
  .btn-ghost{background:#f1f0f8;color:var(--ink);}
  .btn-danger{background:#fff1f1;color:#991b1b;}
  main{max-width:1200px;margin:20px auto;padding:0 16px 60px;}
  .gate{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px;text-align:center;}
  .gate h2{margin-top:0;font-size:1.1rem;}
  .gate input{width:100%;margin:14px 0;}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;flex:1;min-width:120px;}
  .stat .n{font-size:1.5rem;font-weight:800;}
  .stat .l{font-size:.78rem;color:var(--muted);}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .tabs button{background:#eee9fb;color:var(--brand-dark);}
  .tabs button.active{background:var(--brand);color:#fff;}
  .view-tabs{display:flex;gap:6px;}
  .view-tabs button{background:#fff;color:var(--brand-dark);border:1px solid var(--border);}
  .view-tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .toprow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(26,26,46,.05);}
  th, td{padding:10px 12px;text-align:left;font-size:.85rem;border-bottom:1px solid var(--border);vertical-align:top;}
  th{background:#faf9ff;color:var(--muted);text-transform:uppercase;font-size:.72rem;letter-spacing:.03em;}
  tr:last-child td{border-bottom:none;}
  .badge{padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700;display:inline-block;}
  .badge.Pending{background:var(--pending-bg);color:var(--pending);}
  .badge.Approved{background:var(--good-bg);color:var(--good);}
  .badge.Rejected{background:var(--warn-bg);color:var(--warn);}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .editable{border:1px solid transparent;border-radius:6px;padding:3px 5px;min-width:60px;}
  .editable:hover{border-color:var(--border);}
  .editable:focus{border-color:var(--brand);outline:none;background:#fbfaff;}
  #mapView{height:420px;border-radius:12px;margin-bottom:18px;border:1px solid var(--border);}
  .empty{text-align:center;color:var(--muted);padding:30px;}
  .save-hint{font-size:.72rem;color:var(--muted);margin-top:2px;}

  /* ---------- Card gallery ---------- */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:16px;}
  .repairer-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(26,26,46,.05);transition:transform .12s, box-shadow .12s;}
  .repairer-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(26,26,46,.1);}
  .card-media{position:relative;height:110px;background:#eee9fb;}
  .card-media .avatar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.5rem;letter-spacing:.02em;}
  .card-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s;}
  .status-ribbon{position:absolute;top:8px;right:8px;padding:3px 9px;border-radius:20px;font-size:.68rem;font-weight:700;}
  .status-ribbon.Pending{background:var(--pending-bg);color:var(--pending);}
  .status-ribbon.Approved{background:var(--good-bg);color:var(--good);}
  .status-ribbon.Rejected{background:var(--warn-bg);color:var(--warn);}
  .card-body{padding:12px 14px 14px;}
  .card-name{font-weight:700;font-size:.95rem;margin-bottom:4px;line-height:1.25;}
  .card-loc{font-size:.78rem;color:var(--muted);margin-bottom:6px;min-height:2.2em;}
  .card-rating{font-size:.82rem;}
  .stars{color:var(--star);letter-spacing:1px;}
  .rating-num{font-weight:700;font-size:.8rem;margin-left:2px;}
  .rating-count{color:var(--muted);font-size:.75rem;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;position:relative;}
  .modal-close{position:absolute;top:14px;right:14px;background:#f1f0f8;width:32px;height:32px;border-radius:50%;font-size:1rem;line-height:1;padding:0;}
  .modal-header{display:flex;gap:14px;align-items:center;margin-bottom:16px;padding-right:30px;}
  .modal-avatar{width:64px;height:64px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.3rem;overflow:hidden;}
  .modal-avatar img{width:100%;height:100%;object-fit:cover;}
  .modal-name{font-size:1.15rem;font-weight:700;border-radius:6px;padding:2px 4px;margin:-2px -4px 4px;}
  .modal-name:hover{background:#faf9ff;}
  .modal-name:focus{outline:2px solid var(--brand);background:#faf9ff;}
  .modal-rating{margin-top:5px;font-size:.85rem;}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .modal label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;margin:0 0 4px;}
  .modal .static{font-size:.9rem;padding:2px 0;}
  .editable-field{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.9rem;background:#fbfaff;margin-bottom:2px;}
  .editable-field:focus{outline:2px solid var(--brand);}
  .text-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;margin-bottom:2px;}
  #modalMap{height:150px;border-radius:10px;margin:8px 0 14px;border:1px solid var(--border);}
  .modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
  .modal .hint{font-size:.72rem;color:var(--muted);margin:2px 0 10px;}
  .modal-logo-preview{max-width:120px;max-height:120px;border-radius:8px;margin-top:6px;display:none;object-fit:cover;border:1px solid var(--border);}
  .gate-logo{height:44px;margin-bottom:10px;}
</style>
</head>
<body>

<div id="gate" class="gate">
  <img class="gate-logo" src="assets/automart-logo.png" alt="AutoMart IM" />
  <h2>🔐 AutoMart IM Team Login</h2>
  <p style="color:#6b7280;font-size:.85rem;">Enter the admin key configured in the Apps Script project (Script Properties → ADMIN_KEY).</p>
  <input type="password" id="adminKeyInput" placeholder="Admin key" />
  <button class="btn-brand" style="width:100%;" id="loginBtn">Enter Dashboard</button>
  <div id="loginError" style="color:var(--warn);font-size:.8rem;margin-top:10px;"></div>
</div>

<div id="dashboard" style="display:none;">
  <div class="brand-bar"><img src="assets/automart-logo.png" alt="AutoMart IM" /></div>
  <header>
    <h1>🛠️ AutoMart IM — Admin Dashboard</h1>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search shop, phone, address…" />
      <button class="btn-white" id="refreshBtn">↻ Refresh</button>
      <button class="btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="toprow">
      <div class="tabs" id="tabs">
        <button data-status="All" class="active">All</button>
        <button data-status="Pending">Pending</button>
        <button data-status="Approved">Approved</button>
        <button data-status="Rejected">Rejected</button>
      </div>
      <div class="view-tabs" id="viewTabs">
        <button data-view="cards" class="active">🗂️ Cards</button>
        <button data-view="table">📋 Table</button>
        <button data-view="map">🗺️ Map</button>
      </div>
    </div>

    <div id="cardsWrap">
      <div class="cards-grid" id="cardsGrid"></div>
      <div id="cardsEmpty" class="empty" style="display:none;">No repairers in this category yet.</div>
    </div>

    <div id="tableWrap" style="display:none;">
      <table id="table">
        <thead>
          <tr>
            <th>Shop</th><th>Contact</th><th>Address</th><th>Services</th><th>Rating</th><th>Status</th><th>Registered</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="emptyMsg" class="empty" style="display:none;">No repairers in this category yet.</div>
    </div>

    <div id="mapView" style="display:none;"></div>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =========================================================================
   Resilient map tile loader — inlined on every page (not a separate file)
   so no page ever breaks if tiles.js gets left behind during hosting/copying.
   ------------------------------------------------------------------------
   Free raster tile providers occasionally stop working for reasons outside
   our control: OpenStreetMap's own volunteer-run servers block IPs/networks
   that exceed their usage policy, and CARTO's free basemaps now require an
   account + API key. Rather than hard-code one provider and risk another
   silent breakage, this tries a short list of free, no-API-key raster
   providers in order, and automatically swaps to the next one if too many
   tiles fail to load. Call attachResilientTileLayer(map) instead of
   L.tileLayer(...).addTo(map) directly.
   ========================================================================= */
const TILE_PROVIDERS = [
  {
    name: 'Esri World Street Map',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    options: {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom',
      maxZoom: 19
    }
  },
  {
    name: 'OpenStreetMap',
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    options: { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19, subdomains: 'abc' }
  },
  {
    name: 'Wikimedia Maps',
    url: 'https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png',
    options: { attribution: '&copy; OpenStreetMap contributors, style by Wikimedia', maxZoom: 19 }
  }
];

const TILE_ERROR_THRESHOLD = 6; // tile failures before we give up on a provider

function attachResilientTileLayer(map, startIndex) {
  startIndex = startIndex || 0;
  const idx = Math.min(startIndex, TILE_PROVIDERS.length - 1);
  const provider = TILE_PROVIDERS[idx];
  const layer = L.tileLayer(provider.url, provider.options);
  let errorCount = 0;

  layer.on('tileerror', () => {
    errorCount++;
    if (errorCount >= TILE_ERROR_THRESHOLD && idx < TILE_PROVIDERS.length - 1) {
      console.warn(`[AutoMart IM] Map tiles from "${provider.name}" are failing — switching to "${TILE_PROVIDERS[idx + 1].name}".`);
      map.removeLayer(layer);
      attachResilientTileLayer(map, idx + 1);
    }
  });

  layer.addTo(map);
  return layer;
}
</script>
<script>
/* =========================================================================
   CONFIG — paste your deployed Apps Script Web App URL here (same one used
   in signup.html / map.html).
   ========================================================================= */
const CONFIG = {
  API_URL: "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"
};

const MAX_LOGO_BYTES = 3 * 1024 * 1024; // 3MB

let adminKey = '';
let allRepairers = [];
let activeStatus = 'All';
let viewMode = 'cards'; // 'cards' | 'table' | 'map'
let map, markersLayer, modalMap;
let modalSelectedLogo = null; // { base64, mimeType, fileName } — set when admin picks a new photo file

// ---------- Login ----------
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('adminKeyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

async function login() {
  const key = document.getElementById('adminKeyInput').value.trim();
  if (!key) return;
  document.getElementById('loginBtn').textContent = 'Checking…';
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=admin_list&adminKey=${encodeURIComponent(key)}`);
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    adminKey = key;
    sessionStorage.setItem('automart_admin_key', key); // convenience for this tab session only
    allRepairers = result.repairers;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    render();
  } catch (err) {
    document.getElementById('loginError').textContent = err.message;
  } finally {
    document.getElementById('loginBtn').textContent = 'Enter Dashboard';
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  adminKey = '';
  sessionStorage.removeItem('automart_admin_key');
  document.getElementById('gate').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('adminKeyInput').value = '';
});

// Try to restore a key already entered earlier in this browser tab.
window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('automart_admin_key');
  if (saved) {
    document.getElementById('adminKeyInput').value = saved;
    login();
  }
});

// ---------- Data loading ----------
async function refresh() {
  const res = await fetch(`${CONFIG.API_URL}?action=admin_list&adminKey=${encodeURIComponent(adminKey)}`);
  const result = await res.json();
  if (!result.ok) { alert('Failed to refresh: ' + result.error); return; }
  allRepairers = result.repairers;
  render();
}
document.getElementById('refreshBtn').addEventListener('click', refresh);

// ---------- Status tabs & search ----------
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  activeStatus = btn.getAttribute('data-status');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});
document.getElementById('searchInput').addEventListener('input', render);

// ---------- View mode tabs ----------
document.getElementById('viewTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  viewMode = btn.getAttribute('data-view');
  document.querySelectorAll('#viewTabs button').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('cardsWrap').style.display = viewMode === 'cards' ? 'block' : 'none';
  document.getElementById('tableWrap').style.display = viewMode === 'table' ? 'block' : 'none';
  document.getElementById('mapView').style.display = viewMode === 'map' ? 'block' : 'none';
  if (viewMode === 'map') {
    ensureMap();
    setTimeout(() => { map.invalidateSize(); render(); }, 150);
  } else {
    render();
  }
});

// ---------- Render dispatch ----------
function render() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  let items = allRepairers.slice();
  if (activeStatus !== 'All') items = items.filter(r => r.Status === activeStatus);
  if (search) {
    items = items.filter(r =>
      [r.ShopName, r.Phone, r.Address, r.ContactName, r.Email].join(' ').toLowerCase().includes(search)
    );
  }

  renderStats();
  if (viewMode === 'cards') renderCards(items);
  if (viewMode === 'table') renderTable(items);
  if (viewMode === 'map') renderMap(items);
}

function renderStats() {
  const counts = { Pending: 0, Approved: 0, Rejected: 0 };
  allRepairers.forEach(r => { if (counts[r.Status] !== undefined) counts[r.Status]++; });
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${allRepairers.length}</div><div class="l">Total sign-ups</div></div>
    <div class="stat"><div class="n">${counts.Pending}</div><div class="l">Pending review</div></div>
    <div class="stat"><div class="n">${counts.Approved}</div><div class="l">Approved (live on map)</div></div>
    <div class="stat"><div class="n">${counts.Rejected}</div><div class="l">Rejected</div></div>`;
}

// ---------- Card gallery ----------
function renderCards(items) {
  const grid = document.getElementById('cardsGrid');
  document.getElementById('cardsEmpty').style.display = items.length ? 'none' : 'block';
  grid.innerHTML = items.map(cardHtml).join('');
  grid.querySelectorAll('.repairer-card').forEach(card => {
    card.addEventListener('click', () => openModal(card.getAttribute('data-id')));
  });
}

function cardHtml(r) {
  const color = colorForName(r.ShopName || '?');
  const initials = initialsForName(r.ShopName || '?');
  return `
    <div class="repairer-card" data-id="${r.ID}">
      <div class="card-media">
        <div class="avatar" style="background:${color}">${initials}</div>
        ${r.ImageURL ? `<img src="${escapeHtml(r.ImageURL)}" alt="" loading="lazy" onload="this.style.opacity=1" onerror="this.remove()">` : ''}
        <span class="status-ribbon ${r.Status}">${r.Status}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${escapeHtml(r.ShopName)}</div>
        <div class="card-loc">📍 ${escapeHtml(truncate(r.Address, 46))}</div>
        <div class="card-rating">${starsHtml(r.Rating, r.RatingCount)}</div>
      </div>
    </div>`;
}

// ---------- Table view ----------
function renderTable(items) {
  const tbody = document.getElementById('tbody');
  document.getElementById('emptyMsg').style.display = items.length ? 'none' : 'block';
  document.getElementById('table').style.display = items.length ? 'table' : 'none';

  tbody.innerHTML = items.map(r => `
    <tr data-id="${r.ID}">
      <td class="clickable-name">${escapeHtml(r.ShopName)}<div class="save-hint">${escapeHtml(r.ContactName || '')}</div></td>
      <td>${escapeHtml(r.Phone)}<div class="save-hint">${escapeHtml(r.Email || '')}</div></td>
      <td>${escapeHtml(r.Address)}<div class="save-hint">${Number(r.Latitude).toFixed(4)}, ${Number(r.Longitude).toFixed(4)}</div></td>
      <td>${escapeHtml(r.Services || '')}</td>
      <td>${starsHtml(r.Rating, r.RatingCount)}</td>
      <td><span class="badge ${r.Status}">${r.Status}</span></td>
      <td>${formatDate(r.Timestamp)}</td>
      <td>
        <div class="row-actions">
          <button class="btn-brand" data-action="view">View / Edit</button>
        </div>
      </td>
    </tr>
  `).join('');

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('button')) { openModal(tr.getAttribute('data-id')); return; }
    });
  });
}

// ---------- Map view ----------
function ensureMap() {
  if (map) return;
  map = L.map('mapView');
  attachResilientTileLayer(map);
  markersLayer = L.layerGroup().addTo(map);
}

function renderMap(items) {
  if (!map) return;
  markersLayer.clearLayers();
  const bounds = [];
  const colors = { Pending: '#d97706', Approved: '#16a34a', Rejected: '#dc2626' };
  items.forEach(r => {
    if (isNaN(r.Latitude) || isNaN(r.Longitude)) return;
    const icon = L.divIcon({
      html: `<div style="background:${colors[r.Status] || '#666'};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px ${colors[r.Status] || '#666'};"></div>`,
      className: '', iconSize: [14, 14], iconAnchor: [7, 7]
    });
    const m = L.marker([r.Latitude, r.Longitude], { icon }).addTo(markersLayer);
    m.bindPopup(`<strong>${escapeHtml(r.ShopName)}</strong><br>${escapeHtml(r.Address)}<br><span class="badge ${r.Status}">${r.Status}</span>`);
    m.on('click', () => openModal(r.ID));
    bounds.push([r.Latitude, r.Longitude]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
}

// ---------- Detail modal ----------
function openModal(id) {
  const r = allRepairers.find(x => x.ID === id);
  if (!r) return;
  if (modalMap) { modalMap.remove(); modalMap = null; }
  modalSelectedLogo = null;
  document.getElementById('modalBody').innerHTML = modalHtml(r);
  document.getElementById('modalOverlay').classList.add('open');
  wireModalActions(r);
  wireModalLogoUpload();
  initModalMap(r);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  if (modalMap) { modalMap.remove(); modalMap = null; }
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function modalHtml(r) {
  const color = colorForName(r.ShopName || '?');
  const initials = initialsForName(r.ShopName || '?');
  return `
    <div class="modal-header">
      <div class="modal-avatar" style="background:${color}">
        ${r.ImageURL ? `<img src="${escapeHtml(r.ImageURL)}" alt="" onerror="this.remove()">` : initials}
      </div>
      <div>
        <div class="modal-name" contenteditable data-field="ShopName">${escapeHtml(r.ShopName)}</div>
        <span class="badge ${r.Status}">${r.Status}</span>
        <div class="modal-rating">${starsHtml(r.Rating, r.RatingCount)}</div>
      </div>
    </div>

    <div class="modal-grid">
      <div>
        <label>Contact person</label>
        <div class="static">${escapeHtml(r.ContactName || '—')}</div>
      </div>
      <div>
        <label>Phone</label>
        <div class="editable-field" contenteditable data-field="Phone">${escapeHtml(r.Phone)}</div>
      </div>
      <div>
        <label>Email</label>
        <div class="static">${escapeHtml(r.Email || '—')}</div>
      </div>
      <div>
        <label>Registered</label>
        <div class="static">${formatDate(r.Timestamp)} ${r.LastUpdated ? `· updated ${formatDate(r.LastUpdated)}` : ''}</div>
      </div>
    </div>

    <label>Address</label>
    <div class="editable-field" contenteditable data-field="Address">${escapeHtml(r.Address)}</div>
    <div class="save-hint">${isNaN(r.Latitude) ? '' : Number(r.Latitude).toFixed(6)}, ${isNaN(r.Longitude) ? '' : Number(r.Longitude).toFixed(6)}</div>
    <div id="modalMap"></div>

    <label>Services</label>
    <div class="editable-field" contenteditable data-field="Services">${escapeHtml(r.Services || '')}</div>

    <label>Photo / logo</label>
    <input type="file" class="text-input" id="modalLogoFile" accept="image/*">
    <img id="modalLogoPreview" class="modal-logo-preview" alt="New logo preview">
    <div class="hint">Upload a new photo from this device, or edit the link below directly.</div>
    <input type="text" class="text-input" id="modalImageUrl" value="${escapeHtml(r.ImageURL || '')}" placeholder="https://…">
    <div class="hint">Shown on the card gallery and public map. Leave blank to use the shop's initials instead.</div>

    <div class="modal-row">
      <div>
        <label>Rating (0–5)</label>
        <input type="number" min="0" max="5" step="0.1" class="text-input" id="modalRating" value="${r.Rating || 0}">
      </div>
      <div>
        <label>Number of ratings</label>
        <input type="number" min="0" step="1" class="text-input" id="modalRatingCount" value="${r.RatingCount || 0}">
      </div>
    </div>
    <div class="hint">Set by your team as an internal quality score for now — car-owner reviews aren't wired up yet.</div>

    <div class="modal-actions">
      ${r.Status !== 'Approved' ? `<button class="btn-good" data-action="approve">Approve</button>` : ''}
      ${r.Status !== 'Rejected' ? `<button class="btn-warn" data-action="reject">Reject</button>` : ''}
      ${r.Status !== 'Pending' ? `<button class="btn-ghost" data-action="pending">Reset to pending</button>` : ''}
      <button class="btn-brand" data-action="save">Save changes</button>
      <button class="btn-danger" data-action="delete">Delete</button>
    </div>
  `;
}

function initModalMap(r) {
  if (isNaN(r.Latitude) || isNaN(r.Longitude)) return;
  setTimeout(() => {
    modalMap = L.map('modalMap', { zoomControl: false, scrollWheelZoom: false }).setView([r.Latitude, r.Longitude], 15);
    attachResilientTileLayer(modalMap);
    L.marker([r.Latitude, r.Longitude]).addTo(modalMap);
    modalMap.invalidateSize();
  }, 50);
}

function wireModalLogoUpload() {
  const input = document.getElementById('modalLogoFile');
  if (!input) return;
  input.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const preview = document.getElementById('modalLogoPreview');
    if (!file) { modalSelectedLogo = null; preview.style.display = 'none'; return; }

    if (file.size > MAX_LOGO_BYTES) {
      alert('That image is larger than 3MB. Please choose a smaller photo, or paste a photo link instead.');
      e.target.value = '';
      modalSelectedLogo = null;
      preview.style.display = 'none';
      return;
    }

    try {
      const { base64, mimeType, fileName } = await fileToBase64(file);
      modalSelectedLogo = { base64, mimeType, fileName };
      preview.src = `data:${mimeType};base64,${base64}`;
      preview.style.display = 'block';
    } catch (err) {
      alert('Could not read that image: ' + err.message);
    }
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      resolve({ base64, mimeType: file.type || 'image/jpeg', fileName: file.name });
    };
    reader.onerror = () => reject(reader.error || new Error('Read failed'));
    reader.readAsDataURL(file);
  });
}

function wireModalActions(r) {
  const body = document.getElementById('modalBody');
  body.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.getAttribute('data-action');
      if (action === 'approve') return updateStatus(r.ID, 'Approved', true);
      if (action === 'reject') return updateStatus(r.ID, 'Rejected', true);
      if (action === 'pending') return updateStatus(r.ID, 'Pending', true);
      if (action === 'delete') return deleteRepairer(r.ID);
      if (action === 'save') return saveModalEdits(r.ID, body, btn);
    });
  });
}

async function saveModalEdits(id, body, btn) {
  const fields = {};
  body.querySelectorAll('[data-field]').forEach(el => {
    fields[fieldKeyFor(el.getAttribute('data-field'))] = el.textContent.trim();
  });
  fields.rating = document.getElementById('modalRating').value;
  fields.ratingCount = document.getElementById('modalRatingCount').value;

  if (modalSelectedLogo) {
    fields.imageBase64 = modalSelectedLogo.base64;
    fields.imageMimeType = modalSelectedLogo.mimeType;
    fields.imageFileName = modalSelectedLogo.fileName;
  } else {
    fields.imageUrl = document.getElementById('modalImageUrl').value.trim();
  }

  btn.textContent = 'Saving…';
  btn.disabled = true;
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'edit', adminKey, data: { id, ...fields } })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    await refresh();
    closeModal();
  } catch (err) {
    alert('Save failed: ' + err.message);
  } finally {
    btn.textContent = 'Save changes';
    btn.disabled = false;
  }
}

async function deleteRepairer(id) {
  if (!confirm('Delete this repairer permanently? This cannot be undone.')) return;
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', adminKey, data: { id } })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    await refresh();
    closeModal();
  } catch (err) {
    alert('Delete failed: ' + err.message);
  }
}

function fieldKeyFor(dataField) {
  return { ShopName: 'shopName', Phone: 'phone', Address: 'address', Services: 'services' }[dataField];
}

async function updateStatus(id, status, fromModal) {
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'update_status', adminKey, data: { id, status } })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error);
    await refresh();
    if (fromModal) closeModal();
  } catch (err) {
    alert('Update failed: ' + err.message);
  }
}

// ---------- Small helpers ----------
function starsHtml(rating, count) {
  const num = Number(rating) || 0;
  const rounded = Math.max(0, Math.min(5, Math.round(num)));
  let stars = '';
  for (let i = 1; i <= 5; i++) stars += i <= rounded ? '★' : '☆';
  const label = num > 0 ? num.toFixed(1) : 'No rating';
  return `<span class="stars">${stars}</span> <span class="rating-num">${label}</span>${count ? ` <span class="rating-count">(${count})</span>` : ''}`;
}

function colorForName(name) {
  let hash = 0;
  const str = String(name || '?');
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 52%)`;
}

function initialsForName(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

function truncate(str, n) {
  str = String(str || '');
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
